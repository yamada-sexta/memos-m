name: Insider Build CI

on:
  push:
    tags:
      - "v*.i"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Android SDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.android
            $ANDROID_HOME
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/release.keystore

      - name: Build Insider APK
        run: ./gradlew assembleInsider
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Prepare APK for Upload
        run: |
          APK_FILE=$(find app/build/outputs/apk/insider -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then echo "No signed APK found!"; exit 1; fi
          cp "$APK_FILE" "memos-insider.apk"
          echo "APK_PATH=memos-insider.apk" >> $GITHUB_ENV

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Insider Build ${{ github.ref_name }}"
          body: |
            **Insider Build**
            Version: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: ${{ env.APK_PATH }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
